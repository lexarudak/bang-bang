# Публикация сайта на GitHub Pages.
# Сборки нет: site/ содержит готовый index.html, его и отдаём.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; новый push отменяет предыдущий, ещё не доехавший.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Свой домен Pages требует файлом CNAME рядом с индексом.
      # Задаётся в Settings → Secrets and variables → Actions → Variables.
      - name: CNAME
        if: vars.SITE_BASE != ''
        run: echo "${{ vars.SITE_BASE }}" | sed -E 's#^https?://##; s#/.*##' > site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
